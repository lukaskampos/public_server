<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>public_server · Índice</title>
<meta name="description" content="Índice de todas as páginas HTML do repositório lukaskampos/public_server.">
<style>
  :root {
    --bg: #f6f4ee;
    --surface: #ffffff;
    --ink: #1d1c19;
    --muted: #6c675d;
    --line: #e3ded2;
    --soft: #efebe0;
    --accent: #1f3556;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --surface: #1b1e22;
      --ink: #ebe8e1;
      --muted: #a39e93;
      --line: #2b3036;
      --soft: #23272c;
      --accent: #9db7e0;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 72px; }
  .eyebrow {
    font: 500 13px/1 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted);
    letter-spacing: .02em;
    margin: 0 0 14px;
  }
  h1 { font: 700 clamp(28px, 5vw, 38px)/1.15 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sub a { color: inherit; }

  .filter {
    width: 100%;
    padding: 11px 14px;
    margin: 0 0 18px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filter[hidden] { display: none; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li a {
    display: block;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  li a:hover { border-color: var(--accent); transform: translateY(-1px); }
  li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .title { display: block; font-weight: 600; font-size: 1.05rem; color: var(--accent); }
  .desc { display: block; color: var(--muted); font-size: .94rem; margin-top: 4px; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    margin-top: 10px;
    font: 12.5px/1.3 ui-monospace, Menlo, Consolas, monospace;
    color: var(--muted);
  }
  .meta span:first-child { background: var(--soft); padding: 2px 7px; border-radius: 5px; }

  .status { margin: 22px 0 0; font-size: 13px; color: var(--muted); }
  .empty { padding: 28px 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">lukaskampos / public_server</p>
  <h1>Páginas publicadas</h1>
  <p class="sub" id="count">Todos os arquivos <code>.html</code> do repositório.</p>

  <input class="filter" id="filter" type="search" placeholder="Filtrar por nome…" aria-label="Filtrar páginas" hidden>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nenhuma página encontrada.</p>

  <noscript>
    <ul>
      <li><a href="lei-seca-por-blocos-oficial-tjsp.html"><span class="title">Lei Seca por Blocos · Oficial de Justiça TJSP 2026</span></a></li>
      <li><a href="revisao-geral-oficial-tjsp.html"><span class="title">Resumão — Oficial de Justiça TJSP 2026</span></a></li>
    </ul>
  </noscript>

  <p class="status" id="status"></p>
</main>

<script>
(function () {
  var REPO = "lukaskampos/public_server";
  var BRANCH = "main";

  // Títulos e descrições conhecidos. Arquivos novos aparecem sozinhos,
  // com o título derivado do nome do arquivo.
  var META = {
    "lei-seca-por-blocos-oficial-tjsp.html": {
      title: "Lei Seca por Blocos · Oficial de Justiça TJSP 2026",
      desc: "Lei seca do Anexo VIII do Edital 01/2026 (VUNESP), separada por matéria."
    },
    "revisao-geral-oficial-tjsp.html": {
      title: "Resumão — Oficial de Justiça TJSP 2026",
      desc: "Guia de revisão geral: a prova em um olhar, mapa do edital, matérias e revisão final."
    }
  };

  // Lista de reserva (gerada em 11/11/2026), usada se a API do GitHub falhar.
  var FALLBACK = [
    { path: "lei-seca-por-blocos-oficial-tjsp.html", size: 947174 },
    { path: "revisao-geral-oficial-tjsp.html", size: 1078796 }
  ];

  var list = document.getElementById("list");
  var count = document.getElementById("count");
  var status = document.getElementById("status");
  var filter = document.getElementById("filter");
  var empty = document.getElementById("empty");
  var items = [];

  function prettify(path) {
    var name = path.split("/").pop().replace(/\.html?$/i, "").replace(/[-_]+/g, " ");
    return name.charAt(0).toUpperCase() + name.slice(1);
  }
  function fmtSize(n) {
    if (n == null) return "";
    if (n < 1024) return n + " B";
    if (n < 1048576) return Math.round(n / 1024) + " KB";
    return (n / 1048576).toFixed(1).replace(".", ",") + " MB";
  }
  function href(path) {
    return path.split("/").map(encodeURIComponent).join("/");
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render() {
    var q = filter.value.trim().toLowerCase();
    var shown = items.filter(function (it) {
      return !q || (it.path + " " + it.title + " " + it.desc).toLowerCase().indexOf(q) !== -1;
    });
    list.innerHTML = shown.map(function (it) {
      return '<li><a href="' + esc(href(it.path)) + '">' +
        '<span class="title">' + esc(it.title) + '</span>' +
        (it.desc ? '<span class="desc">' + esc(it.desc) + '</span>' : '') +
        '<span class="meta"><span>' + esc(it.path) + '</span>' +
        (it.size != null ? '<span>' + fmtSize(it.size) + '</span>' : '') +
        '</span></a></li>';
    }).join("");
    empty.hidden = shown.length !== 0;
    var total = items.length;
    count.textContent = total + (total === 1 ? " página" : " páginas") + " no repositório.";
    filter.hidden = total < 6;
  }

  function setItems(files) {
    items = files
      .filter(function (f) {
        return /\.html?$/i.test(f.path) && f.path.toLowerCase() !== "index.html";
      })
      .map(function (f) {
        var m = META[f.path] || {};
        return { path: f.path, size: f.size, title: m.title || prettify(f.path), desc: m.desc || "" };
      })
      .sort(function (a, b) { return a.title.localeCompare(b.title, "pt-BR"); });
    render();
  }

  filter.addEventListener("input", render);

  // 1) mostra a lista de reserva na hora
  setItems(FALLBACK);

  // 2) atualiza com o que realmente está no repositório
  fetch("https://api.github.com/repos/" + REPO + "/git/trees/" + BRANCH + "?recursive=1", {
    headers: { Accept: "application/vnd.github+json" }
  })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      var files = (data.tree || []).filter(function (n) { return n.type === "blob"; });
      setItems(files);
      status.textContent = data.truncated
        ? "Lista parcial: o repositório é grande demais para a API."
        : "";
    })
    .catch(function () {
      status.textContent = "Não foi possível consultar o GitHub agora; mostrando a última lista conhecida.";
    });
})();
</script>
</body>
</html>
